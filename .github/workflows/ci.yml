name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: LintFix
        run: npm run lint:fix
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  docker:
    name: Build docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER != '' && format('{0}/team-friendship-backend', secrets.ACR_LOGIN_SERVER) || 'team-friendship-backend' }} # Default to local image name if the reigstry name is empty
          tags: |
            type=sha,format=short
            type=sha,format=long
            type=ref,event=branch

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        env:
          IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/team-friendship-backend:sha-${{ github.sha }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only save the image during a push to main
        run: docker save --output "${{ runner.temp }}/image.tar" "$IMAGE"

      - name: Upload Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only upload the image during a push to main
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  azure:
    name: Push the docker image to Azure Container Registry
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only push the image during a push to main
    steps:
      - uses: actions/checkout@v4

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load --input "${{ runner.temp }}/image.tar"

      - name: Log in to Azure
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        run: >-
          az login --service-principal
          --username "$CLIENT_ID"
          --password "$CLIENT_SECRET"
          --tenant "$TENANT_ID"
          --subscription "$SUBSCRIPTION_ID"

      - name: Log in to Azure Container Registry
        run: az acr login -n ${{ secrets.ACR_NAME }}

      - name: Push the image to Azure Container Registry
        run: docker push ${{ secrets.ACR_LOGIN_SERVER }}/team-friendship-backend:sha-${{ github.sha }}

      - name: Verify the image in Azure Container Registry
        run: az acr repository show -n ${{ secrets.ACR_NAME }} --image team-friendship-backend:sha-${{ github.sha }} # Check the full SHA tag

  resolve-frontend:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Log in to Azure
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        run: |
          az login --service-principal --username "$CLIENT_ID" \
            --password "$CLIENT_SECRET" --tenant "$TENANT_ID"
          az account set --subscription "$SUBSCRIPTION_ID"

      - name: Find frontend image
        id: image
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          tag=$(az acr repository show-tags -n "$ACR_NAME" \
            --repository team-friendship-frontend \
            --orderby time_desc --top 1 -o tsv)
          [ -n "$tag" ] || { echo "No frontend image found"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  terraform:
    name: Deploy infrastructure with terraform
    needs: [azure, resolve-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_acr_login_server: ${{ secrets.ACR_LOGIN_SERVER }}
      TF_VAR_backend_image: ${{ secrets.ACR_LOGIN_SERVER }}/team-friendship-backend:sha-${{ github.sha }}
      TF_VAR_frontend_image: ${{ secrets.ACR_LOGIN_SERVER }}/team-friendship-frontend:${{ needs.resolve-frontend.outputs.tag }}
    defaults:
      run:
        working-directory: my-infrastructure/modules/root
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only deploy during a push to main
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        run: >-
          az login --service-principal
          --username "$CLIENT_ID"
          --password "$CLIENT_SECRET"
          --tenant "$TENANT_ID"
          --subscription "$SUBSCRIPTION_ID"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize Terraform
        run: terraform init

      - name: Format Terraform
        run: terraform fmt

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan -var-file=dev.tfvars

      - name: Apply Terraform
        run: terraform apply -var-file=dev.tfvars -auto-approve

  terraform-plan:
    name: Plan terraform
    needs: resolve-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_acr_login_server: ${{ secrets.ACR_LOGIN_SERVER }}
      TF_VAR_backend_image: ${{ secrets.ACR_LOGIN_SERVER }}/team-friendship-backend:sha-${{ github.sha }}
      TF_VAR_frontend_image: ${{ secrets.ACR_LOGIN_SERVER }}/team-friendship-frontend:${{ needs.resolve-frontend.outputs.tag }}

    defaults:
      run:
        working-directory: my-infrastructure/modules/root
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        run: >-
          az login --service-principal
          --username "$CLIENT_ID"
          --password "$CLIENT_SECRET"
          --tenant "$TENANT_ID"
          --subscription "$SUBSCRIPTION_ID"

      - name: Log in to Azure Container Registry
        run: az acr login -n ${{ secrets.ACR_NAME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize Terraform
        run: terraform init

      - name: Plan Terraform
        run: terraform plan -var-file=dev.tfvars -out=tfplan

  terraform-prod:
    name: Deploy prod infrastructure with terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: my-infrastructure/modules/root
    if: github.event_name == 'workflow_dispatch' # Only deploy when approved manually
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        run: >-
          az login --service-principal
          --username "$CLIENT_ID"
          --password "$CLIENT_SECRET"
          --tenant "$TENANT_ID"
          --subscription "$SUBSCRIPTION_ID"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Initialize Terraform
        run: terraform init

      - name: Format Terraform
        run: terraform fmt

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan -var-file=prod.tfvars

      - name: Apply Terraform
        run: terraform apply -var-file=prod.tfvars -auto-approve
